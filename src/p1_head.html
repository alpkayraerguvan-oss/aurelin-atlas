<title>Aurelin Atlas</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,300;7..72,400;7..72,600;7..72,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Yerleşim: tek sütunlu bilimsel dergi omurgası; her bölümde koyu bir
   "numune penceresi" (viewport) belge akışının içine gömülür. */
:root{
  --bg:#EFF3F2; --surface:#FBFDFC; --raise:#E4ECEA; --fg:#0B1A1D;
  --muted:#516467; --faint:#7C8D90; --line:#D2DEDB; --line-2:#BECDC9;
  --accent:#0A6C70; --accent-2:#08585B; --accent-soft:#D6EBE9;
  /* numune penceresi her iki temada koyu kalır */
  --stage:#071215; --stage-2:#0C1E22; --stage-fg:#DAE9E7;
  --stage-muted:#7B9599; --stage-line:#1A2E33;
  /* biyokimya kodları (her iki temada okunur) */
  --cat:#2E86CE; --ani:#D24D45; --hyd:#C08A2E; --pol:#6E8589; --cys:#C9A215;
  --ok:#2E7D5B; --on-accent:#FFFFFF;
  --fD:'Literata',Georgia,'Times New Roman',serif;
  --fB:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fM:'IBM Plex Mono',ui-monospace,'DejaVu Sans Mono','Courier New',monospace;
  --r:10px; --rs:6px;
  --maxw:1180px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#081315; --surface:#0D1E21; --raise:#132A2E; --fg:#DDEAE8;
  --muted:#8AA1A4; --faint:#6C8386; --line:#1B3135; --line-2:#264247;
  --accent:#57CFC6; --accent-2:#7EDED6; --accent-soft:#0F3033;
  --cat:#5AA9EC; --ani:#EC7169; --hyd:#E0B054; --pol:#8DA5AA; --cys:#EBC93F;
  --ok:#54C08D; --on-accent:#04191A; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#081315; --surface:#0D1E21; --raise:#132A2E; --fg:#DDEAE8;
  --muted:#8AA1A4; --faint:#6C8386; --line:#1B3135; --line-2:#264247;
  --accent:#57CFC6; --accent-2:#7EDED6; --accent-soft:#0F3033;
  --cat:#5AA9EC; --ani:#EC7169; --hyd:#E0B054; --pol:#8DA5AA; --cys:#EBC93F;
  --ok:#54C08D; --on-accent:#04191A; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--fB);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--fD);font-weight:600;text-wrap:balance;margin:0;
  letter-spacing:-.012em}
a{color:var(--accent);text-underline-offset:3px}
em{font-style:italic}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:20px}
.mono{font-family:var(--fM);font-variant-numeric:tabular-nums}

/* ---------------------------------------------------------------- başlık */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:16px;min-height:56px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:auto;min-width:0}
.brand b{font-family:var(--fD);font-size:18px;font-weight:700;letter-spacing:.005em}
.brand span{font-size:11px;color:var(--faint);font-family:var(--fM);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.sec{display:flex;gap:2px}
nav.sec a{font-size:12.5px;color:var(--muted);text-decoration:none;
  padding:5px 9px;border-radius:var(--rs)}
nav.sec a:hover{color:var(--fg);background:var(--raise)}
.langs{display:flex;border:1px solid var(--line-2);border-radius:var(--rs);overflow:hidden}
.langs button{font:500 11.5px/1 var(--fM);letter-spacing:.06em;padding:7px 9px;
  background:transparent;color:var(--muted);border:0;cursor:pointer}
.langs button+button{border-left:1px solid var(--line-2)}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

/* ------------------------------------------------------------------ hero */
.hero{padding-block:46px 30px;border-bottom:1px solid var(--line)}
.kick{font:500 11px/1 var(--fM);letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent)}
.hero h1{font-size:clamp(34px,6.4vw,62px);line-height:1.02;margin:16px 0 0;
  font-weight:700;letter-spacing:-.025em}
.hero .lede{max-width:60ch;color:var(--muted);font-size:16.5px;margin:16px 0 0}
.facts{display:flex;flex-wrap:wrap;gap:0;margin-top:30px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
  overflow:hidden}
.fact{flex:1 1 150px;min-width:0;padding:13px 16px;border-right:1px solid var(--line)}
.fact:last-child{border-right:0}
.fact b{display:block;font-family:var(--fM);font-size:19px;font-weight:500;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.fact span{display:block;font-size:11.5px;color:var(--faint);margin-top:2px}

/* --------------------------------------------------------------- bölümler */
section{padding-block:56px;border-bottom:1px solid var(--line)}
.shead{max-width:62ch}
.shead h2{font-size:clamp(24px,3.6vw,34px);margin:12px 0 0;line-height:1.14}
.shead p{color:var(--muted);margin:14px 0 0}
.grid{display:grid;gap:18px;margin-top:26px}
@media(min-width:900px){.grid.v{grid-template-columns:minmax(0,1.58fr) minmax(0,1fr)}
  .grid.h{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}

/* --------------------------------------------------- koyu numune penceresi */
.stage{background:var(--stage);border:1px solid var(--stage-line);
  border-radius:var(--r);position:relative;overflow:hidden;color:var(--stage-fg)}
.stage canvas{display:block;width:100%;touch-action:none}
.stagebar{position:absolute;inset:auto 0 0 0;display:flex;gap:8px;
  padding:9px 12px;font:400 11px/1 var(--fM);color:var(--stage-muted);
  background:linear-gradient(transparent,rgba(4,12,14,.82));pointer-events:none}
.tag{position:absolute;top:10px;left:12px;font:500 10px/1 var(--fM);
  letter-spacing:.1em;text-transform:uppercase;color:var(--stage-muted);
  border:1px solid var(--stage-line);border-radius:100px;padding:5px 9px;
  background:rgba(7,18,21,.6)}

/* -------------------------------------------------------------- paneller */
.panel{background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:16px}
.panel h3{font-size:14px;font-family:var(--fB);font-weight:600;margin-bottom:2px}
.psub{font-size:11.5px;color:var(--faint);margin-bottom:12px}
.ctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.ctl label.g{font:500 10.5px/1 var(--fM);letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--rs);
  overflow:hidden}
.seg button{font:400 12px/1 var(--fB);padding:7px 10px;background:transparent;
  color:var(--muted);border:0;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;
  color:var(--muted);cursor:pointer;user-select:none}
.chk input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.btn{font:400 12px/1 var(--fB);padding:7px 12px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--muted);border-radius:var(--rs);cursor:pointer}
.btn:hover{color:var(--fg);border-color:var(--accent)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,
textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);
  outline-offset:2px}

/* ------------------------------------------------------------- dizi şeridi */
.seqstrip{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}
.aa{width:21px;height:26px;border-radius:3px;border:0;cursor:pointer;padding:0;
  font:500 12px/1 var(--fM);color:#fff;position:relative;opacity:.92}
.aa:hover{opacity:1;transform:translateY(-1px)}
.aa[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:1px;opacity:1}
.aa i{position:absolute;inset:auto 0 2px 0;font-size:7px;font-style:normal;
  opacity:.7;font-family:var(--fM)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:12px;font-size:11.5px;
  color:var(--muted)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;
  margin-right:5px;vertical-align:baseline}
.readout{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;
  min-height:96px}
.rrow{display:flex;gap:10px;font-size:12.5px;padding:2px 0}
.rrow dt{color:var(--faint);min-width:74px;flex:none}
.rrow dd{margin:0;color:var(--fg)}
.empty{color:var(--faint);font-size:12.5px;font-style:italic}

/* ------------------------------------------------------------- hesaplayıcı */
.seqin{width:100%;min-height:92px;resize:vertical;font:400 13px/1.7 var(--fM);
  letter-spacing:.06em;padding:11px 12px;border:1px solid var(--line-2);
  border-radius:var(--rs);background:var(--bg);color:var(--fg);word-break:break-all}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;margin-top:16px}
.met{background:var(--surface);padding:11px 13px;min-width:0}
.met span{display:block;font-size:10.5px;color:var(--faint);
  letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.met b{display:block;font:500 17px/1.25 var(--fM);margin-top:3px;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.met b u,.fact b u{font-size:10.5px;text-decoration:none;color:var(--faint);
  margin-left:3px;font-weight:400}
@media(min-width:560px){.metrics{grid-template-columns:repeat(5,minmax(0,1fr))}}
.hint{font-size:11.5px;color:var(--faint);margin-top:12px;max-width:72ch}
.warn{color:var(--ani);font-size:11.5px;margin-top:6px}

/* -------------------------------------------------------------- seçicilik */
.memgrid{display:grid;gap:14px;margin-top:22px}
@media(min-width:820px){.memgrid{grid-template-columns:1fr 1fr}}
.memcap{font-size:12.5px;color:var(--muted);margin-top:10px}
.memhd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.memhd b{font-size:13.5px}
.memhd span{font:400 11px/1 var(--fM);color:var(--faint)}

/* ------------------------------------------------------------ yöntem akışı */
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:24px;
  scrollbar-width:thin}
.step{flex:0 0 auto;border:1px solid var(--line-2);background:var(--surface);
  border-radius:var(--rs);padding:9px 12px;cursor:pointer;text-align:left;
  min-width:112px;color:var(--muted)}
.step b{display:block;font:600 12.5px/1.3 var(--fB);color:var(--fg)}
.step span{display:block;font:400 10.5px/1.3 var(--fM);color:var(--faint);margin-top:2px}
.step[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.step[aria-pressed="true"] b{color:var(--accent-2)}
.stepno{font:500 9.5px/1 var(--fM);letter-spacing:.1em;color:var(--faint);
  display:block;margin-bottom:4px}
.stagewrap{display:grid;gap:16px;margin-top:16px}
@media(min-width:900px){.stagewrap{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
.stepbody h3{font-size:19px;margin-bottom:8px}
.stepbody p{color:var(--muted);font-size:14px;margin:0}
.stepmeta{font:400 11px/1 var(--fM);color:var(--accent);margin-bottom:10px;
  letter-spacing:.04em}

/* ------------------------------------------------------------------- alt */
footer{padding-block:40px 56px;color:var(--muted);font-size:13px}
footer h3{font-size:14px;font-family:var(--fB);margin-bottom:10px}
footer p{max-width:78ch;margin:0 0 14px}
footer ol{max-width:78ch;padding-left:20px;margin:0;font-size:12.5px;line-height:1.75}
footer li{margin-bottom:5px}
.disc{border-left:2px solid var(--accent);padding-left:12px;font-size:12.5px;
  color:var(--faint);margin-top:18px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;
  transition-duration:.001ms!important}}
</style>
